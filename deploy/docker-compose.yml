services:
  postgres:
    image: postgres:18-alpine
    container_name: haalkhata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  redis:
    image: redis:8-alpine
    container_name: haalkhata-redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass $${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: auth-service
    restart: unless-stopped
    environment:
      JAVA_OPTS: ${AUTH_JAVA_OPTS}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: https://104.207.92.108
      APP_OTP_STORE: redis
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 640m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  haalkhata-service:
    build:
      context: .
      dockerfile: Dockerfile.haalkhata
    container_name: haalkhata-service
    restart: unless-stopped
    environment:
      JAVA_OPTS: ${HAALKHATA_JAVA_OPTS}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
      JWT_SECRET: ${HAALKHATA_JWT_SECRET}
      TRUSTED_JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_MINUTES: 10080
      REFRESH_TOKEN_DAYS: 30
      HAALKHATA_STORAGE_DIR: /app/storage
      HAALKHATA_LOG_DIR: /app/logs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MAIL_PROVIDER: ${MAIL_PROVIDER}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      LOG_REQUEST_BODY: "false"
    volumes:
      - haalkhata_storage:/app/storage
      - haalkhata_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  caddy:
    image: caddy:2-alpine
    container_name: haalkhata-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - auth-service
      - haalkhata-service
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

volumes:
  postgres_data:
  redis_data:
  haalkhata_storage:
  haalkhata_logs:
  caddy_data:
  caddy_config:
